# Publishes scheduled guides: rebuilds main every morning and deploys it.
#
# A guide whose publishOn date (src/data/guides.ts, src/data/pt/index.ts,
# src/data/id/index.ts) is in the future is left out of the build, so it
# appears on the first morning its date has come — with no one at a keyboard.
# See src/data/publish.ts. On a day with nothing due the deploy uploads no
# changed files.
#
# It deploys main exactly as it is. main only ever receives merges that were
# approved for deployment (MAINTENANCE.md), so this adds no new path to
# production — it re-runs the approved one on a timer.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   a token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  from the Cloudflare dashboard's account home page
#
# GitHub disables scheduled workflows in a public repo after 60 days without
# repository activity. A daily deploy is not activity — only commits are — so
# on the 1st and the 15th this workflow commits a one-line date file
# (.github/heartbeat). That keeps both scheduled workflows running for months
# with nobody touching the repo. It changes nothing on the site. Pull before
# working locally again (MAINTENANCE.md).

name: Publish scheduled guides

on:
  schedule:
    - cron: '30 0 * * *'   # every day 00:30 UTC (06:00 IST)
  workflow_dispatch:

permissions:
  contents: write   # only for the heartbeat commit

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Before the build, so a failed build cannot also cost the heartbeat;
      # continue-on-error, so a failed push cannot cost the day's deploy.
      - name: Heartbeat (1st and 15th)
        if: github.event_name == 'schedule'
        continue-on-error: true
        run: |
          day=$(date -u +%d)
          if [ "$day" = "01" ] || [ "$day" = "15" ]; then
            date -u +%Y-%m-%d > .github/heartbeat
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .github/heartbeat
            git commit -m 'chore: heartbeat (keeps the scheduled workflows enabled)' && git push
          else
            echo "not a heartbeat day ($day)"
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Build (guides due today and earlier)
        run: npm run build
      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify production
        run: node scripts/fidelity/verify-live.mjs
